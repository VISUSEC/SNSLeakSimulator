<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS情報漏洩シミュレータ - VISUSEC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sns-pane">
        <div class="sns-header">
            <span id="sns-title">Mockitter</span>
            <button onclick="resetNavigation()">ターゲットに戻る</button>
        </div>
        <div class="sns-content" id="sns-content"></div>
    </div>

    <div class="reset-pane">
        <div class="intro-panel">
            <h2>OSINT パスワード突破演習</h2>
            <p>ターゲットの公開情報（OSINT）を収集し、パスワード再設定画面の「秘密の質問」を突破してください。<br>
            ※投稿をクリックすると<b>詳細（返信スレッド）</b>が見られます。「❤️いいね」の数からも情報が探せます。</p>
        </div>

        <div class="control-panel">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">演習シナリオの選択</label>
            <select id="scenario-selector" onchange="loadSelectedScenario()"></select>
        </div>
        <div class="reset-card" id="reset-card">
            <h2>パスワード再設定</h2>
            <div class="form-group"><label>ターゲットID</label><input type="text" id="target-id-display" disabled style="background: #f8f9fa;"></div>
            <div id="questions-container"></div>
            <button class="action-btn" onclick="attemptReset()">再設定を実行</button>
            <div id="feedback"></div>
        </div>
    </div>

    <footer>
        <div>©VISUSEC 2022-2026 <a href="https://visusec.jp/license/" target="_blank">利用規約</a></div>
        <div>SNS情報漏洩シミュレータ （Version 1.0 - 20260713）[origin 20260430]</div>
    </footer>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
